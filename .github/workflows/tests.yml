name: Spine Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  godot-headless-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.2.2 (headless)
        run: |
          set -e
          curl -L -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project resources (fail on any script/parse error)
        run: |
          set -o pipefail
          ./godot --headless --path . --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|does not inherit" import.log; then
            echo "::error::Godot reported script/parse errors during import (see log above)."
            exit 1
          fi

      - name: Run spine tests (legacy prototype)
        run: ./godot --headless --path . tests/TestRunner.tscn

      - name: Run core tests (new foundation + content validation)
        run: ./godot --headless --path . tests/CoreTestRunner.tscn
